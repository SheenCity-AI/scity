<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>SheenCity AI 教学平台 · 原型 v0.4</title>
<style>
:root{
  --bg:#0B0B0E;--p1:#131318;--p2:#1a1a21;--p3:#22222b;--ln:rgba(255,255,255,.08);--ln2:rgba(255,255,255,.14);
  --t1:#F2F2F4;--t2:rgba(242,242,244,.66);--t3:rgba(242,242,244,.42);
  --red:#E8312F;--red2:#ff5a4e;--rl:#ff8a7a;--glow:0 0 24px rgba(232,49,47,.45);
  --c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--gold:#ffd08a;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;color:var(--t1);font-size:14px;line-height:1.55}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;color:inherit}
.num{font-family:"DIN Alternate","DejaVu Sans Mono",monospace;letter-spacing:.3px}
.hide{display:none!important}
.app{width:1440px;height:900px;margin:0 auto;background:var(--bg);position:relative;overflow:hidden;color:var(--t1)}
.app::before{content:"";position:absolute;inset:0;background:radial-gradient(900px 500px at 78% -10%,rgba(232,49,47,.15),transparent 60%),radial-gradient(700px 500px at -10% 110%,rgba(57,135,229,.07),transparent 60%);pointer-events:none}
/* HUD */
.hud{position:absolute;top:0;left:0;right:0;height:64px;display:flex;align-items:center;padding:0 24px;gap:16px;z-index:5}
.mark{width:34px;height:34px;border-radius:10px;background:var(--red);display:grid;place-items:center;font-weight:900;box-shadow:var(--glow)}
.who{display:flex;align-items:center;gap:10px}
.ava{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#ffb199,#E8312F);display:grid;place-items:center;font-weight:800;position:relative;flex-shrink:0}
.ava.t{background:linear-gradient(135deg,#9cc3f5,#3987e5)}.ava.k{background:linear-gradient(135deg,#9be3c6,#199e70)}
.ava b{position:absolute;right:-6px;bottom:-4px;background:#000;border:1px solid var(--ln2);font-size:10px;border-radius:8px;padding:0 4px}
.xp{width:150px;height:5px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:4px}
.xp i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--red2));box-shadow:var(--glow);transition:width .6s}
.res{margin-left:auto;display:flex;gap:10px;align-items:center}
.res>div{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.05);border:1px solid var(--ln);border-radius:20px;padding:5px 14px 5px 10px;font-size:13px;color:var(--t2);cursor:default}
.res>div b{color:var(--t1);font-size:15px}
.gem{width:13px;height:13px;transform:rotate(45deg);background:linear-gradient(135deg,#ff8a7a,var(--red));border-radius:3px;box-shadow:var(--glow);display:inline-block}
.roles{display:flex;gap:2px;background:rgba(255,255,255,.04);border:1px solid var(--ln);border-radius:10px;padding:3px;margin-left:8px}
.roles button{border:0;background:none;font-size:12px;color:var(--t3);padding:4px 10px;border-radius:7px}
.roles button.on{background:var(--p3);color:var(--t1)}
.proto{font-size:11px;color:var(--gold);border:1px solid rgba(255,208,138,.35);border-radius:6px;padding:1px 6px}
/* rail */
.rail{position:absolute;left:0;top:64px;bottom:0;width:72px;display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:16px;z-index:5}
.rail a{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;color:var(--t3);font-size:11px;text-align:center;line-height:1.2;cursor:pointer;position:relative}
.rail a i{display:block;font-style:normal;font-size:19px;margin-bottom:1px}
.rail a:hover{color:var(--t2)}
.rail a.on{background:rgba(232,49,47,.14);color:var(--t1);box-shadow:inset 0 0 0 1px rgba(232,49,47,.5)}
.rail a .dot{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:var(--glow)}
.rail .sp{flex:1}
.view{position:absolute;left:72px;top:64px;right:0;bottom:0;display:none}
.view.on{display:block}
.pg{padding:8px 28px 24px;height:100%;overflow:auto}
.pg::-webkit-scrollbar{width:6px}.pg::-webkit-scrollbar-thumb{background:var(--p3);border-radius:3px}
.h1{font-size:28px;font-weight:800;letter-spacing:1px}
.h1 small{font-size:14px;color:var(--t3);font-weight:400;margin-left:12px;letter-spacing:0}
.h2{font-size:17px;font-weight:800}
.mut{color:var(--t3);font-size:12px}
.sub{color:var(--t2)}
.panel{background:var(--p1);border:1px solid var(--ln);border-radius:20px;padding:18px;position:relative}
.row{display:flex;gap:16px}
.b{border:1px solid var(--ln2);background:rgba(255,255,255,.04);color:var(--t1);padding:6px 14px;border-radius:18px;font-size:13px;white-space:nowrap}
.b:hover{border-color:rgba(255,255,255,.3)}
.b.p{background:var(--red);border-color:var(--red);box-shadow:var(--glow)}
.b.p:hover{background:var(--red2)}
.b.sm{padding:3px 10px;font-size:12px}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.tg{font-size:11px;border-radius:4px;padding:0 6px;white-space:nowrap;flex-shrink:0;display:inline-block}
.tg.m{background:rgba(232,49,47,.18);color:var(--rl)}.tg.s{background:rgba(57,135,229,.18);color:#8ab8f0}.tg.o{background:rgba(25,158,112,.18);color:#6fd3ab}.tg.y{background:rgba(201,133,0,.18);color:#f0c060}.tg.g{background:rgba(255,255,255,.08);color:var(--t2)}
.chipx{font-size:11px;border-radius:10px;padding:1px 8px;border:1px solid var(--ln2);color:var(--t2);white-space:nowrap}
.bar{height:5px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}.bar i{display:block;height:100%;background:var(--red)}
.note{font-size:12px;color:#f0c060;background:rgba(201,133,0,.10);border:1px solid rgba(201,133,0,.3);border-radius:10px;padding:7px 12px}
.tabs{display:flex;gap:6px;margin-top:14px}
.tabs button{border:1px solid var(--ln);background:none;color:var(--t3);border-radius:18px;padding:5px 14px;font-size:13px}
.tabs button.on{background:var(--p3);color:var(--t1);border-color:var(--ln2)}
/* ========== 助理 ========== */
.chatcol{position:absolute;left:0;top:0;bottom:0;width:700px;display:flex;flex-direction:column;padding:4px 28px 20px}
.stream{flex:1;overflow:auto;display:flex;flex-direction:column;gap:16px;padding:10px 4px 14px 0}
.stream::-webkit-scrollbar{width:4px}.stream::-webkit-scrollbar-thumb{background:var(--p3)}
.stream .spacer{flex:1}
.am{display:flex;gap:12px;max-width:630px;animation:up .3s ease both}
.am .sa{width:30px;height:30px;border-radius:9px;background:var(--red);display:grid;place-items:center;font-weight:900;font-size:13px;flex-shrink:0;box-shadow:var(--glow)}
.am .c{flex:1;min-width:0}
.am .c p{margin-bottom:6px}
.um{align-self:flex-end;background:var(--p2);border:1px solid var(--ln);padding:10px 14px;border-radius:16px 16px 4px 16px;max-width:520px;animation:up .3s ease both}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
.mem{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 8px}
.mem span{font-size:12px;color:var(--t2);background:rgba(57,135,229,.10);border:1px solid rgba(57,135,229,.28);border-radius:12px;padding:1px 9px;cursor:pointer}
.mem span.h{background:none;border:0;padding-left:0;color:var(--t3);cursor:default}
.run{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--t2);background:var(--p1);border:1px solid var(--ln);border-radius:10px;padding:8px 12px;margin:4px 0 8px}
.ok{width:16px;height:16px;border-radius:50%;background:var(--c3);display:grid;place-items:center;font-size:10px;flex-shrink:0}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--red);border-top-color:transparent;animation:sp 1s linear infinite;flex-shrink:0}
@keyframes sp{to{transform:rotate(360deg)}}
.cost{margin-left:auto;color:var(--t3)}
.brief{background:linear-gradient(135deg,rgba(232,49,47,.10),rgba(255,255,255,.02));border:1px solid rgba(232,49,47,.25);border-radius:16px;padding:12px 16px}
.brief .r{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--ln)}
.brief .r:first-of-type{border:0}
.brief .r .x{margin-left:auto;color:var(--t3);font-size:12px;white-space:nowrap}
.sugg{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.sugg button{border:1px solid var(--ln2);background:rgba(255,255,255,.03);border-radius:16px;padding:4px 12px;font-size:12.5px;color:var(--t2)}
.sugg button:hover{border-color:var(--red);color:var(--t1)}
.input{background:var(--p1);border:1px solid var(--ln2);border-radius:18px;padding:12px 14px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.input textarea{width:100%;border:0;outline:0;background:none;resize:none;height:26px;font-size:15px}
.input textarea::placeholder{color:var(--t3)}
.input .bt{display:flex;align-items:center;gap:8px;margin-top:8px}
.k{font-size:12px;color:var(--t3);border:1px solid var(--ln);border-radius:6px;padding:1px 7px}
.send{margin-left:auto;width:34px;height:34px;border-radius:50%;background:var(--red);display:grid;place-items:center;box-shadow:var(--glow);border:0}
.mic{width:34px;height:34px;border-radius:50%;border:1px solid var(--ln2);display:grid;place-items:center;color:var(--t2);background:none}
.stagewrap{position:absolute;left:700px;right:24px;top:4px;bottom:20px}
.stg{height:100%;border-radius:22px;border:1px solid var(--ln);background:var(--p1);overflow:hidden;position:relative;display:flex;flex-direction:column}
.stg .lab{position:absolute;top:16px;left:18px;font-size:11px;letter-spacing:3px;color:var(--t3);z-index:2}
.hero{flex:1;background-size:cover;background-position:center;position:relative;min-height:200px}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,11,14,.0) 45%,rgba(19,19,24,1))}
.stg .ft{padding:0 20px 20px;margin-top:-80px;position:relative;z-index:1}
.stg h3{font-size:22px}
.thumbs{display:flex;gap:10px;margin-top:12px}
.thumbs div{flex:1;height:66px;border-radius:10px;background-size:cover;background-position:center;border:1px solid var(--ln2);cursor:pointer}
.thumbs div.on{border-color:var(--red);box-shadow:var(--glow)}
.warn{display:inline-block;margin-top:10px;font-size:12px;color:#ffb36b;background:rgba(201,133,0,.12);border:1px solid rgba(201,133,0,.35);border-radius:8px;padding:4px 10px}
.stgpad{padding:52px 22px 20px;overflow:auto;height:100%}
.steps .st{display:flex;gap:10px;align-items:center;padding:6px 0;color:var(--t3);font-size:13px}
.steps .st.d{color:var(--t1)}.steps .st.r{color:var(--t1)}
.steps .st i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ln2);flex-shrink:0}
.steps .st.d i{background:var(--c3);border-color:var(--c3)}
.steps .st.r i{border-color:var(--red);border-top-color:transparent;animation:sp 1s linear infinite}
/* ========== 知识 ========== */
.kn{position:absolute;inset:0}
.kn .graph{position:absolute;left:0;top:0;bottom:0;right:380px}
.kn .side{position:absolute;right:24px;top:8px;bottom:20px;width:340px;display:flex;flex-direction:column;gap:14px}
.kn .hdr{position:absolute;left:28px;top:8px;z-index:2}
.legend{display:flex;gap:14px;font-size:12px;color:var(--t2);margin-top:8px;align-items:center;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.ramp{display:inline-block;width:80px;height:8px;border-radius:4px;background:linear-gradient(90deg,#3a1d1d,#8a2422,#E8312F,#ff8a7a);vertical-align:middle;margin:0 6px}
.gnode{cursor:pointer}
.gnode:hover circle.core{stroke:#fff}
.kstat{display:flex;gap:22px;margin-top:10px}
.kstat b{display:block;font-size:24px}
.cls{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.cls .r{display:flex;align-items:center;gap:10px;font-size:13px}
.cls .r span:first-child{width:96px;color:var(--t2)}
.cls .r .bar{flex:1;height:8px}
/* ========== 课题 ========== */
.tcard{display:flex;gap:16px;background:var(--p1);border:1px solid var(--ln);border-radius:20px;overflow:hidden;cursor:pointer;transition:.2s}
.tcard:hover{border-color:var(--ln2);transform:translateY(-2px)}
.tcard .im{width:280px;flex-shrink:0;background-size:cover;background-position:center;position:relative}
.tcard .bd{padding:18px 20px 18px 0;flex:1}
.path{display:flex;align-items:center;margin-top:14px}
.nd{display:flex;flex-direction:column;align-items:center;width:84px;flex-shrink:0;font-size:12px;color:var(--t3);text-align:center}
.nd .o{width:30px;height:30px;border-radius:50%;border:2px solid var(--ln2);display:grid;place-items:center;margin-bottom:5px;background:rgba(0,0,0,.4);font-weight:800;font-size:12px}
.nd.d .o{background:var(--red);border-color:var(--red);color:#fff}.nd.d{color:var(--t2)}
.nd.c .o{border-color:var(--red);color:#fff;box-shadow:0 0 0 6px rgba(232,49,47,.18),var(--glow);width:38px;height:38px}.nd.c{color:var(--t1)}
.lk{flex:1;height:2px;background:var(--ln2);margin-bottom:22px;min-width:10px}.lk.d{background:var(--red)}
.small-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:12px}
.mini{background:var(--p1);border:1px solid var(--ln);border-radius:16px;padding:14px}
.mini.dis{opacity:.5}
.qq{background:#0f1a2a;border-radius:14px;overflow:hidden;border:1px solid rgba(57,135,229,.35)}
.qq .qh{background:linear-gradient(#2d6fc0,#1d4f90);padding:6px 12px;font-size:13px;display:flex;justify-content:space-between}
.qq .qb{padding:10px 12px;height:170px;overflow:auto;font-family:"SimSun","Songti SC",serif;font-size:13px;color:#d9e6f7}
.qq .qb p{margin-bottom:8px}.qq .qb p b{color:#7fb2f0;font-weight:normal}.qq .qb p.me b{color:#6fd3ab}
.qq .qi{display:flex;gap:6px;padding:6px;background:#0b1422}.qq .qi input{flex:1;background:#14233a;border:1px solid rgba(57,135,229,.35);border-radius:6px;padding:4px 8px;outline:0}
.drop{border:1.5px dashed var(--ln2);border-radius:12px;padding:16px;text-align:center;color:var(--t3);cursor:pointer}
.drop.ok{border-color:var(--c3);color:#6fd3ab;background:rgba(25,158,112,.08)}
/* 作品集网页 */
.pf{background:#f4f1ec;color:#1b1b1b;border-radius:16px;overflow:hidden;margin-top:14px}
.pf .top{height:200px;background:url(img/i-518.jpg) center/cover;position:relative}
.pf .top::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 30%,rgba(0,0,0,.65))}
.pf .top>div{position:absolute;left:26px;bottom:18px;color:#fff;z-index:1}
.pf .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:18px 26px 24px}
.pf .w{border-radius:10px;overflow:hidden;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.pf .w .im{height:120px;background-size:cover;background-position:center}
.pf .w .t{padding:8px 10px;font-size:13px}
.pf .w .t span{display:block;font-size:11px;color:#777}
.url{display:flex;align-items:center;gap:8px;background:var(--p2);border:1px solid var(--ln);border-radius:10px;padding:6px 10px;font-size:13px;color:var(--t2)}
/* ========== OPC ========== */
.q{background:var(--p1);border:1px solid var(--ln);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.q .im{height:120px;background-size:cover;background-position:center;position:relative}
.q .im span{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.72)!important;padding:1px 8px;border-radius:6px}
.q .bd{padding:14px 16px;flex:1;display:flex;flex-direction:column}
.q h4{font-size:15px}
.q .rw{display:flex;gap:6px;margin-top:8px;align-items:center;font-size:12px;color:var(--t2);flex-wrap:wrap}
.star{color:#ffb36b;letter-spacing:1px}
.reward{margin-left:auto;color:var(--gold);font-weight:700}
.qgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:12px}
.studio{border-radius:18px;padding:18px;background:linear-gradient(135deg,rgba(25,158,112,.14),rgba(255,255,255,.02));border:1px solid rgba(25,158,112,.35)}
.kpi{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:14px}
.kpi .panel b{display:block;font-size:26px;margin-top:2px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--ln);font-size:13px}
th{color:var(--t3);font-weight:500}
/* ========== 我 ========== */
.wallet{background:linear-gradient(135deg,#2a1214,#4a1517 60%,#9a2220);border:0}
.hexes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.hx{background:var(--p2);border:1px solid var(--ln);border-radius:14px;padding:12px}
.hx .lv{font-size:22px;font-weight:800}
/* 弹层 */
.mask{position:absolute;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:30;backdrop-filter:blur(4px)}
.modal{background:var(--p1);border:1px solid var(--ln2);border-radius:20px;width:460px;padding:24px}
.toast{position:absolute;top:74px;left:50%;transform:translateX(-50%);background:#fff;color:#111;padding:8px 18px;border-radius:20px;z-index:40;font-size:13px;opacity:0;transition:.3s;pointer-events:none;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.toast.on{opacity:1}
.xpfx{position:absolute;z-index:41;color:var(--gold);font-weight:800;font-size:18px;pointer-events:none;animation:fly 1.4s ease forwards;text-shadow:0 0 12px rgba(255,208,138,.6)}
@keyframes fly{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-50px)}}
/* 开场 */
.onb{position:absolute;inset:0;z-index:20;background:radial-gradient(800px 500px at 50% 40%,rgba(232,49,47,.22),transparent 60%),#07070a;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.onb .orb{width:120px;height:120px;border-radius:36px;background:var(--red);display:grid;place-items:center;font-size:52px;font-weight:900;box-shadow:0 0 80px rgba(232,49,47,.6);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 120px rgba(232,49,47,.85)}}
.onb h1{font-size:34px;margin-top:30px}
.onb .lines{margin-top:18px;color:var(--t2);font-size:16px;line-height:2}
.onb .four{display:flex;gap:14px;margin-top:30px}
.onb .four div{width:200px;background:rgba(255,255,255,.04);border:1px solid var(--ln);border-radius:16px;padding:16px;text-align:left}
.onb .four b{display:block;font-size:15px;margin-bottom:4px}
.tip{position:fixed;pointer-events:none;background:#000;border:1px solid var(--ln2);color:#fff;font-size:12px;padding:4px 8px;border-radius:6px;display:none;z-index:60;max-width:260px}

/* 知识泡泡 */
.app{--gUn:rgba(242,242,244,.28);--glink:rgba(255,255,255,.12)}
.gsvg{display:block}
.glink{stroke:var(--glink);stroke-width:1}
.ghub{fill:var(--red)}.ghalo{fill:none;stroke:var(--red);stroke-opacity:.35;stroke-dasharray:2 4;animation:sp 30s linear infinite;transform-origin:0 0}
.ghubt{fill:#fff;font-weight:800;font-size:18px}
.glab{fill:var(--t1);font-weight:600;pointer-events:none}.glab.on{fill:#fff}.glab.un{fill:var(--t3);font-weight:400}
.gval{fill:var(--t1);font-weight:800;pointer-events:none;font-family:'DIN Alternate','DejaVu Sans Mono',monospace}.gval.on{fill:#fff}
.gnode{cursor:grab}
.gnode.pulse .gbub{animation:pz 1.6s ease-in-out 3}
@keyframes pz{50%{stroke-width:6;stroke:var(--gold)}}
.legend .lg2{display:inline-flex;align-items:center;gap:6px}
.legend .dd,.legend .sz{display:inline-flex;gap:3px;align-items:center}
.legend .dd i{width:10px;height:10px;border-radius:50%;background:var(--c1);margin:0}
.legend .sz i{border-radius:50%;background:var(--t3);margin:0}.legend .sz i:nth-child(1){width:6px;height:6px}.legend .sz i:nth-child(2){width:10px;height:10px}.legend .sz i:nth-child(3){width:14px;height:14px}
.legend .dash{width:12px;height:12px;border-radius:50%;border:1.5px dashed var(--t2);background:none;margin:0}

<body>
<div class="app" id="app">

<!-- 开场：没有课程也没有任务时 -->
<div class="onb" id="onb">
  <div class="orb">S</div>
  <h1>你好，我是你的 SCity 助手</h1>
  <div class="lines">懂城市更新和空间智能的那种。<br>在学校，我陪你上课、做项目、接活；毕业后，我陪你工作。</div>
  <div class="four">
    <div><b>✦ 助理</b><span class="mut">有事直接说，我来办</span></div>
    <div><b>◈ 知识</b><span class="mut">你学会的，会长成一张图</span></div>
    <div><b>▦ 课题</b><span class="mut">学院的课题和你的作品集</span></div>
    <div><b>◆ OPC</b><span class="mut">真实项目，真实收入</span></div>
  </div>
  <div class="acts" style="margin-top:30px;justify-content:center"><button class="b p" style="padding:10px 34px;font-size:15px" onclick="startApp()">开始</button></div>
  <div class="mut" style="margin-top:16px">通过飞书登录 · 你的知识库存在你自己的飞书里，数据归你本人所有</div>
</div>

<div class="hud">
  <div class="mark">S</div>
  <div class="who" id="who"></div>
  <span class="proto">原型 v0.4 · 示例数据</span>
  <div class="res" id="res"></div>
  <button class="thm" id="thm" onclick="toggleTheme()">☀ 浅色</button>
  <div class="roles" id="roles"><button data-r="stu" class="on">学生</button><button data-r="tea">老师</button><button data-r="ops">孵化器运营</button></div>
</div>
<div class="rail" id="rail">
  <a data-v="ai" class="on"><i>✦</i>助理</a>
  <a data-v="kn"><i>◈</i>知识</a>
  <a data-v="tp"><i>▦</i>课题<span class="dot"></span></a>
  <a data-v="opc"><i>◆</i>OPC</a>
  <div class="sp"></div>
  <a data-v="me"><i>◍</i>我</a>
</div>

<!-- ============ 助理 ============ -->
<section class="view on" id="v-ai">
  <div class="chatcol">
    <div class="stream" id="stream"><div class="spacer"></div></div>
    <div class="sugg" id="sugg"></div>
    <div class="input">
      <textarea id="ask" placeholder="和助理说点什么，或者把文件拖进来…"></textarea>
      <div class="bt"><span class="k">/ 指令</span><span class="k">@ 课题</span><span class="k"># 记忆</span><span class="mut" id="ctx" style="margin-left:6px">当前：筑年 · 第 4 课</span><button class="mic" style="margin-left:auto" onclick="toast('语音输入（演示）')">🎙</button><button class="send" onclick="send()">↑</button></div>
    </div>
  </div>
  <div class="stagewrap"><div class="stg" id="stage"></div></div>
</section>

<!-- ============ 知识 ============ -->
<section class="view" id="v-kn">
  <div class="kn">
    <div class="hdr">
      <div class="h1" id="knTitle">知识<small>你学会的，会长成一张图 · 存在你的飞书多维表格里</small></div>
      <div class="tabs" id="knTabs"><button data-f="all" class="on">全部</button><button data-f="zn">筑年</button><button data-f="cj">空间采集</button><button data-f="side">只看支线</button></div>
      <div class="legend" id="knLegend"></div>
    </div>
    <div class="graph" id="graph"></div>
    <div class="side" id="knSide"></div>
  </div>
</section>

<!-- ============ 课题 ============ -->
<section class="view" id="v-tp"><div class="pg" id="tpPg"></div></section>

<!-- ============ OPC ============ -->
<section class="view" id="v-opc"><div class="pg" id="opcPg"></div></section>

<!-- ============ 我 ============ -->
<section class="view" id="v-me"><div class="pg" id="mePg"></div></section>

<div class="mask hide" id="mask"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
</div>
<div class="tip" id="tip"></div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const S={role:'stu',view:'ai',sub:1820,subT:3000,bal:260,xp:64,lv:7,qqLeft:5,uploaded:false,submitted:false,kFilter:'all',kSel:null,tp:null,opcTab:'board'};
const fmt=n=>n.toLocaleString('en-US');
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2300)}
function spend(n){const a=Math.min(S.sub,n);S.sub-=a;S.bal-=n-a;hud();return n}
function gainXP(n,ev){S.xp+=n*0.4;if(S.xp>=100){S.xp-=100;S.lv++;toast(`升级！Lv${S.lv}`)}hud();
  const f=document.createElement('div');f.className='xpfx';f.textContent=`+${n} XP`;const r=$('#app').getBoundingClientRect();
  f.style.left=((ev&&ev.clientX)?ev.clientX-r.left:220)+'px';f.style.top=((ev&&ev.clientY)?ev.clientY-r.top-20:60)+'px';$('#app').append(f);setTimeout(()=>f.remove(),1400)}
function openM(html){$('#modal').innerHTML=html;$('#mask').classList.remove('hide')}
function closeM(){$('#mask').classList.add('hide')}
$('#mask').onclick=e=>{if(e.target.id==='mask')closeM()};
const tip=$('#tip');
function hov(el,t){el.addEventListener('mousemove',v=>{tip.style.display='block';tip.innerHTML=t;tip.style.left=v.clientX+12+'px';tip.style.top=v.clientY+12+'px'});el.addEventListener('mouseleave',()=>tip.style.display='none')}

/* ---------- HUD ---------- */
function hud(){
  const r=S.role;
  $('#who').innerHTML=r==='stu'?`<div class="ava">林<b class="num">Lv${S.lv}</b></div><div><div style="font-weight:700">林晓 <span class="mut" style="font-weight:400">· 建筑学 2026 级 · 助理建筑师</span></div><div class="xp"><i style="width:${S.xp}%"></i></div></div>`
   :r==='tea'?`<div class="ava t">陈</div><div><div style="font-weight:700">陈老师 <span class="mut" style="font-weight:400">· 建筑城规学院</span></div><div class="mut">在「筑年」中的角色：主讲</div></div>`
   :`<div class="ava k">周</div><div><div style="font-weight:700">周敏 <span class="mut" style="font-weight:400">· 重庆某大学 OPC 校园孵化器 · 运营</span></div><div class="mut">城市合伙人：重庆渝新教育（示例）</div></div>`;
  $('#res').innerHTML=r==='ops'?`<div>入驻 OPC <b class="num">36</b></div><div><span class="gem"></span>本月 Token <b class="num">8.6M</b></div>`
   :r==='tea'?`<div>学生 <b class="num">28</b></div><div onclick="go('me')" style="cursor:pointer"><span class="gem"></span>点数 <b class="num">${fmt(S.sub+S.bal)}</b></div>`
   :`<div title="精力">⚡ <b class="num">7/12</b></div><div onclick="go('me')" style="cursor:pointer"><span class="gem"></span>点数 <b class="num">${fmt(S.sub+S.bal)}</b></div><div>🔥 <b class="num">12</b> 天</div>`;
}
/* ---------- 导航 ---------- */
function go(v){S.view=v;$$('.rail a').forEach(a=>a.classList.toggle('on',a.dataset.v===v));$$('.view').forEach(x=>x.classList.toggle('on',x.id==='v-'+v));
  if(v==='kn')renderKn();if(v==='tp')renderTp();if(v==='opc')renderOpc();if(v==='me')renderMe();}
$$('.rail a').forEach(a=>a.onclick=()=>go(a.dataset.v));
$$('#roles button').forEach(b=>b.onclick=()=>{$$('#roles button').forEach(x=>x.classList.remove('on'));b.classList.add('on');S.role=b.dataset.r;S.tp=null;S.kSel=null;hud();initChat();go(S.role==='ops'?'opc':'ai')});
function startApp(){$('#onb').classList.add('hide');setTimeout(()=>brief(),300)}

/* ================= 助理 ================= */
function addU(t){const d=document.createElement('div');d.className='um';d.textContent=t;$('#stream').append(d);scr();}
function addA(html){const d=document.createElement('div');d.className='am';d.innerHTML=`<div class="sa">S</div><div class="c">${html}</div>`;$('#stream').append(d);scr();return d}
function scr(){const s=$('#stream');s.scrollTop=s.scrollHeight}
function mem(arr){return `<div class="mem"><span class="h">◉ 想起了</span>${arr.map(x=>`<span onclick="go('kn')">${x}</span>`).join('')}</div>`}
function think(cb,ms=600){const d=addA('<div class="run"><span class="spin"></span>正在想…</div>');setTimeout(()=>{d.remove();cb()},ms)}
function setSugg(list){$('#sugg').innerHTML=list.map(([t,f])=>`<button data-f="${f}">${t}</button>`).join('');$$('#sugg button').forEach(b=>b.onclick=()=>{addU(b.textContent);A[b.dataset.f]()})}
function send(){const v=$('#ask').value.trim();if(!v)return;$('#ask').value='';addU(v);
  const m=[['CNCUBE','cncube'],['导入','cncube'],['弱','weak'],['薄弱','weak'],['接','gig'],['活','gig'],['作品集','portfolio'],['注册','opcreg'],['批','grade'],['开','open5']].find(([k])=>v.includes(k));
  if(m&&A[m[1]])return A[m[1]]();
  think(()=>{spend(2);addA(`<p>（原型演示）正式版会结合你的课题资料、知识图谱和记忆来回答，背后接豆包等大模型。</p><div class="mut">−2 点</div>`)})}
$('#ask').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});

function stageDefault(){
  if(S.role==='tea')return stageClass();
  $('#stage').innerHTML=`<div class="lab onimg">舞台 · 今天</div><div class="hero" style="background-image:url(img/i-518.jpg)"></div>
  <div class="ft"><h3>王姐家的两居室</h3><div class="mut">筑年 · 第 4 课 · 家具布置委托 · 剩 31 小时</div>
  <div class="row" style="gap:10px;margin-top:12px">
    <div class="panel" style="flex:1;padding:12px"><div class="mut">本周主线</div><div class="num" style="font-size:22px;font-weight:800">+3 <span style="font-size:13px;color:var(--t3)">知识点</span></div></div>
    <div class="panel" style="flex:1;padding:12px"><div class="mut">工作室</div><div class="num" style="font-size:22px;font-weight:800">2 <span style="font-size:13px;color:var(--t3)">单进行中</span></div></div>
    <div class="panel" style="flex:1;padding:12px"><div class="mut">点数</div><div class="num" style="font-size:22px;font-weight:800">${fmt(S.sub+S.bal)}</div></div>
  </div>
  <div class="acts"><button class="b p" onclick="go('tp');openTp('zn')">打开课题</button><button class="b" onclick="go('kn')">看我的知识图</button></div></div>`}

function brief(){
  if(S.role==='tea')return briefT();
  addA(`<div class="brief"><div style="font-weight:700;margin-bottom:2px">早，林晓。今天 3 件事，我按轻重排好了：</div>
    <div class="r"><span class="tg m">课题</span>王姐家的家具委托，剩 <b class="num">31</b> 小时<span class="x">+120 XP</span></div>
    <div class="r"><span class="tg s">悬赏</span>新开放：教学楼 B 实景 + 1:1 真值模型，可组队<span class="x">训练课题</span></div>
    <div class="r"><span class="tg o">OPC</span>工作室注册还差 1 份材料，我可以帮你生成<span class="x">3 / 6</span></div>
    <div class="acts"><button class="b p" onclick="addU('先做委托。底图导进 CNCUBE，按我昨晚画的布置出白模，再来三个视角。');A.cncube()">先做委托</button><button class="b" onclick="addU('把注册材料生成了');A.opcreg()">把材料生成了</button><button class="b" onclick="toast('好的，下午 3 点再提醒你')">稍后提醒</button></div></div>`);
  setSugg([['把底图导进 CNCUBE 出白模','cncube'],['我最近哪里比较弱？','weak'],['帮我找个能接的活','gig'],['生成我的作品集网页','portfolio']]);
}
const A={
 cncube(){think(()=>{
   const d=addA(mem(['王姐：床别对门','窗边放梳妆台','你昨晚 23:10 的草图','第 3 课被扣分：比例'])+`<div class="run" id="cr"><span class="spin"></span>正在调度你电脑上的 CNCUBE…</div>`);
   stageRun(()=>{spend(18);d.querySelector('#cr').outerHTML=`<div class="run"><span class="ok">✓</span>你电脑上的 CNCUBE · 6 步完成 · 1 分 52 秒<span class="cost num">−18 ◆</span></div>`;
     d.querySelector('.c').insertAdjacentHTML('beforeend',`<p>白模和三个视角在右边。整体没问题，只有一处：次卧床边通道只有 <b class="num">0.55</b> 米，规范要 0.6 米以上——你上次也是在尺度上被扣的分。</p><div class="acts"><button class="b p" onclick="addU('给我两个改法');A.fix()">给我两个改法</button><button class="b" onclick="addU('直接提交给陈老师');A.submit(event)">直接提交给陈老师</button></div>`);scr();
     setSugg([['给我两个改法','fix'],['问问王姐能不能换床','askwang'],['提交给陈老师','submit']]);});
 })},
 fix(){think(()=>{spend(4);addA(`<p>两个改法：</p><p>① 床改成 1.0 米宽，通道变 0.75 米，书桌不动；<br>② 床转 90° 靠窗，通道 0.9 米，但书桌要挪到门边，采光差一点。</p><p>王姐说过“小房间以后给孩子”，我更推荐 ①。要我直接在 CNCUBE 里改成 ① 吗？</p><div class="acts"><button class="b p" onclick="addU('按①改');A.fixdo()">按 ① 改</button><button class="b" onclick="addU('按②改');A.fixdo()">按 ② 改</button></div><div class="mut">−4 点</div>`);
   setSugg([['按①改','fixdo'],['提交给陈老师','submit']])})},
 fixdo(){think(()=>{spend(6);addA(`<div class="run"><span class="ok">✓</span>CNCUBE · 已修改次卧，重新渲染 1 张<span class="cost num">−6 ◆</span></div><p>改好了，通道 0.75 米。这一处我也记进了你的知识图：<b>人体尺度</b> 掌握度会在老师评分后更新。</p><div class="acts"><button class="b p" onclick="addU('提交给陈老师');A.submit(event)">提交给陈老师</button></div>`);
   $('#stage .warn')&&($('#stage .warn').outerHTML='<div class="warn" style="color:#6fd3ab;border-color:rgba(25,158,112,.4);background:rgba(25,158,112,.1)">✓ 次卧通道 0.75 m，已符合</div>');
   setSugg([['提交给陈老师','submit'],['生成我的作品集网页','portfolio']])})},
 askwang(){think(()=>{addA(`<p>我替你在模拟 QQ 里问了王姐（消耗 1 轮，还剩 ${--S.qqLeft} 轮）：</p><div class="panel" style="padding:10px 12px;font-family:SimSun,serif;color:#d9e6f7;background:#0f1a2a">王姐：床小点没关系，孩子还小。你看着办，周四前给我。</div>`);spend(1)})},
